spring.application.name=moler
server.port=8080

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=moler;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=11112222
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Hibernate SQL terminal logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

SECRET_KEY=your_very_long_random_secret_key_at_least_32_bytes